name: Release Obsidian plugin

on:
 push:
  tags:
   - '*'

jobs:
 build:
  runs-on: ubuntu-latest
  # Needed to create the release below - the default GITHUB_TOKEN is
  # read-only unless a workflow asks for more, whatever the repo's own
  # "Workflow permissions" setting happens to default to.
  permissions:
   contents: write

  steps:
   - uses: actions/checkout@v4

   - name: Use Node.js
     uses: actions/setup-node@v4
     with:
      node-version: '22.x'
      cache: 'npm'

   # Obsidian installs the release whose tag matches manifest.json exactly, so a
   # mismatch here ships a release nobody can install. Cheaper to fail the build.
   - name: Check the tag matches the manifest
     run: |
      tag="${GITHUB_REF#refs/tags/}"
      manifest="$(node -p "require('./manifest.json').version")"

      if [ "$tag" != "$manifest" ]; then
        echo "Tag $tag does not match manifest.json version $manifest" >&2
        exit 1
      fi

   - name: Build plugin
     run: |
      npm ci
      npm run lint
      npm test
      npm run build

   - name: Create release
     env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      tag="${GITHUB_REF#refs/tags/}"

      gh release create "$tag" \
        --title="$tag" \
        --draft \
        main.js manifest.json styles.css
