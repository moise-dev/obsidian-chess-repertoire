name: Release Obsidian plugin

on:
 push:
  tags:
   - '*'

jobs:
 build:
  runs-on: ubuntu-latest
  # Needed to create the release below - the default GITHUB_TOKEN is
  # read-only unless a workflow asks for more, whatever the repo's own
  # "Workflow permissions" setting happens to default to.
  permissions:
   contents: write

  steps:
   - uses: actions/checkout@v4

   - name: Use Node.js
     uses: actions/setup-node@v4
     with:
      node-version: '22.x'
      cache: 'npm'

   # Obsidian installs the release whose tag matches manifest.json exactly, so a
   # mismatch here ships a release nobody can install. Cheaper to fail the build.
   - name: Check the tag matches the manifest
     run: |
      tag="${GITHUB_REF#refs/tags/}"
      manifest="$(node -p "require('./manifest.json').version")"

      if [ "$tag" != "$manifest" ]; then
        echo "Tag $tag does not match manifest.json version $manifest" >&2
        exit 1
      fi

   # A release with no notes is one nobody can read before installing it. The
   # changelog entry for this version is that description, and a version with
   # nothing written about it fails the build the same way a mismatched
   # manifest does - at the point where it is still cheap to write.
   - name: Take the release notes from the changelog
     run: |
      tag="${GITHUB_REF#refs/tags/}"

      awk -v tag="$tag" '
        index($0, "## [" tag "]") == 1 { found = 1; next }
        found && /^## \[/ { exit }
        found && /^\[[0-9]/ { next }
        found { print }
      ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md

      if [ ! -s release-notes.md ]; then
        echo "CHANGELOG.md has nothing under ## [$tag] to release with" >&2
        exit 1
      fi

      cat release-notes.md

   - name: Build plugin
     run: |
      npm ci
      npm run lint
      npm test
      npm run build

   - name: Create release
     env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      tag="${GITHUB_REF#refs/tags/}"

      gh release create "$tag" \
        --title="$tag" \
        --notes-file release-notes.md \
        --draft \
        main.js manifest.json styles.css
